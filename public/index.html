<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%232a78d6'/><path d='M3 10l3-3 2 2 5-5' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Site Monitor</div>
    <nav class="tabs" id="tabs">
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#issues" data-tab="issues">Issues</a>
      <a href="#logs" data-tab="logs">Logs</a>
      <a href="#requests" data-tab="requests">Requests</a>
      <a href="#uptime" data-tab="uptime">Uptime</a>
      <a href="#server" data-tab="server">Server</a>
    </nav>
    <div class="controls">
      <div class="segmented" id="range" role="group" aria-label="Time range">
        <button data-range="1h">1h</button>
        <button data-range="6h">6h</button>
        <button data-range="24h">24h</button>
        <button data-range="7d">7d</button>
        <button data-range="30d">30d</button>
      </div>
      <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">↻</button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <script src="app.js"></script>
</body>
</html>
